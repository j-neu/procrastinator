<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Procrastitype — Slogan Pin: Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
img, svg { display: block; max-width: 100%; }

:root {
  --canvas-w: 1000px; --canvas-h: 1500px;
  --bg:#FAF7F2; --surface:#F1ECE2; --surface-2:#E3DCCC;
  --ink:#20242C; --ink-muted:#6B6F76;
  --accent:#A32035;
  --font-display:'Fraunces',serif; --font-body:'Libre Franklin',sans-serif;
}

html, body { background: var(--bg); }
body { width: var(--canvas-w); font-family: var(--font-body); color: var(--ink); }
h1,.display { font-family:var(--font-display); font-weight:900; line-height:.95; letter-spacing:-0.015em; }

.canvas {
  position: relative; width: var(--canvas-w); height: var(--canvas-h);
  overflow: hidden; background: var(--bg);
  padding: 66px 72px;
  display: flex; flex-direction: column;
}

.folio {
  display: flex; justify-content: space-between; align-items: center;
  font: 600 20px/1 var(--font-body); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-muted);
  padding-bottom: 20px; border-bottom: 1px solid var(--ink);
}

.standfirst {
  margin-top: 40px; font: italic 400 32px/1.4 var(--font-display); color: var(--ink-muted); max-width: 820px;
}

.rule-heavy { margin-top: 34px; border-top: 3px solid var(--ink); }

.quote-wrap { position: relative; flex: 1; display: flex; align-items: center; }
.quote-mark {
  position: absolute; top: -10px; left: -20px; font-family: var(--font-display); font-weight: 900;
  font-size: 300px; color: var(--accent); line-height: 1; opacity: 0.9; z-index: 0;
}
.pull-quote {
  position: relative; z-index: 1; font-size: 152px; line-height: 1.02; letter-spacing: -0.015em;
}
.pull-quote .soft { color: var(--ink-muted); font-weight: 400; font-style: italic; }

.footer {
  margin-top: 20px; padding-top: 26px; border-top: 3px solid var(--ink);
  display: flex; align-items: center; justify-content: space-between; gap: 30px;
}
.cta {
  font-family: var(--font-display); font-weight: 900; font-size: 34px; color: var(--accent);
  white-space: nowrap; flex: none;
}
.cta .arrow { font-family: Arial, 'Libre Franklin', sans-serif; font-weight: 700; }
.footer-right { text-align: right; }
.footer-right .sub { font: italic 400 24px/1.4 var(--font-display); color: var(--ink); }
.footer-right .url { margin-top: 6px; font: 600 20px/1 var(--font-body); color: var(--ink-muted); letter-spacing: .02em; }
</style>
</head>
<body>
<!-- COMPOSITION: Editorial spread — a full-bleed pull-quote is the hero,
     a huge oxblood quote mark behind it (the style's one rationed accent),
     folio rules top/bottom as the mandatory magazine chrome. Text sized
     for thumbnail reading, not just full-canvas: pull-quote runs 84px,
     nothing on the page drops below 20px. -->
<div class="canvas" data-document-role="page" data-label="Slogan Pin — Editorial">

  <div class="folio">
    <span>Procrastitype</span>
    <span>Field Notes &middot; No. 04</span>
  </div>

  <div class="standfirst">On why the advice you've tried never sticks &mdash; and what does instead.</div>

  <div class="rule-heavy"></div>

  <div class="quote-wrap" data-hero>
    <div class="quote-mark" data-overlap-ok>&ldquo;</div>
    <div class="pull-quote">
      It&rsquo;s not laziness.<br>
      <span class="soft">It&rsquo;s a pattern</span><br>
      with a name.
    </div>
  </div>

  <div class="footer">
    <div class="cta">Take the free quiz&nbsp;<span class="arrow">&rarr;</span></div>
    <div class="footer-right">
      <div class="sub">find your pattern in two minutes</div>
      <div class="url">procrastitype.jnorthwood.com</div>
    </div>
  </div>

</div>
</body>
</html>
