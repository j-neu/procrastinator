<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Procrastitype — Slogan Pin: Memphis Pattern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
img, svg { display: block; max-width: 100%; }

:root {
  --canvas-w: 1000px; --canvas-h: 1500px;
  --bg: #FFF8EF; --ink: #241C3D;
  --coral: #FF6B6B; --teal: #26C6B0; --yellow: #FFC93C; --purple: #8C6BF2; --pink: #FF8FC7;
  --font-display: 'Baloo 2', cursive; --font-body: 'Nunito', sans-serif;
}

html, body { background: var(--bg); }
body { width: var(--canvas-w); font-family: var(--font-body); color: var(--ink); }

.canvas {
  position: relative; width: var(--canvas-w); height: var(--canvas-h);
  overflow: hidden; background: var(--bg);
  padding: 58px 54px;
  display: flex; flex-direction: column; align-items: center;
}
.confetti { position: absolute; z-index: 0; }

.kicker {
  position: relative; z-index: 3; font-family: var(--font-display); font-weight: 700; font-size: 28px;
  color: var(--purple); background: #fff; border: 4px solid var(--ink); border-radius: 40px;
  padding: 10px 28px; transform: rotate(-2deg);
}

.headline {
  position: relative; z-index: 3; margin-top: 30px; font-family: var(--font-display); font-weight: 800;
  font-size: 78px; line-height: 1.06; text-align: center; color: var(--ink);
}
.headline .hl {
  color: var(--coral); -webkit-text-stroke: 2px var(--ink);
}

.badge-wrap { position: relative; z-index: 2; flex: 1; display: flex; align-items: center; justify-content: center; margin-top: 30px; }
.badge {
  position: relative; width: 560px; height: 560px; border-radius: 50%; background: var(--teal);
  border: 6px solid var(--ink); display: flex; align-items: center; justify-content: center; flex-direction: column;
  transform: rotate(-3deg);
}
.badge .n { font-family: var(--font-display); font-weight: 800; font-size: 190px; color: #fff; -webkit-text-stroke: 3px var(--ink); line-height: 1; }
.badge .t { margin-top: 4px; font-family: var(--font-display); font-weight: 700; font-size: 32px; color: var(--ink); text-align: center; }
.badge-ring { position: absolute; inset: -18px; border-radius: 50%; border: 4px dashed var(--ink); opacity: 0.35; }

.footer { position: relative; z-index: 3; margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.cta-btn {
  background: var(--yellow); color: var(--ink); font-family: var(--font-display); font-weight: 800; font-size: 40px;
  padding: 22px 48px; border: 5px solid var(--ink); border-radius: 20px; transform: rotate(1.5deg);
  box-shadow: 7px 7px 0 var(--ink);
}
.footer .sub { font-weight: 700; font-size: 24px; color: var(--ink); }
</style>
</head>
<body>
<!-- COMPOSITION: Big Object — one giant sticker-badge ("7") is the hero,
     confetti shapes scattered in the empty zones around it. Original style
     (not from any skill file): 80s-Memphis-design palette and shape
     vocabulary (squiggles, triangles, dashed rings), thick ink outlines +
     text-stroke on display type, hard drop shadows instead of blur. -->
<div class="canvas" data-document-role="page" data-label="Slogan Pin — Memphis Pattern">

  <svg class="confetti" style="top:130px; left:40px;" width="60" height="60" viewBox="0 0 60 60"><path d="M4 30 Q 16 8 30 30 T 56 30" stroke="var(--coral)" stroke-width="7" fill="none" stroke-linecap="round"/></svg>
  <svg class="confetti" style="top:210px; right:60px;" width="44" height="40" viewBox="0 0 44 40"><polygon points="0,0 44,0 22,38" fill="var(--purple)" transform="rotate(12 22 19)"/></svg>
  <svg class="confetti" style="top:850px; left:60px;" width="50" height="50"><circle cx="25" cy="25" r="18" fill="none" stroke="var(--pink)" stroke-width="7"/></svg>
  <svg class="confetti" style="bottom:340px; right:70px;" width="44" height="40" viewBox="0 0 44 40"><polygon points="0,0 44,0 22,38" fill="var(--yellow)" transform="rotate(-16 22 19)"/></svg>
  <svg class="confetti" style="top:900px; right:30px;" width="60" height="60" viewBox="0 0 60 60"><path d="M4 30 Q 16 52 30 30 T 56 30" stroke="var(--teal)" stroke-width="7" fill="none" stroke-linecap="round"/></svg>
  <svg class="confetti" style="bottom:120px; left:80px;" width="46" height="46"><circle cx="23" cy="23" r="16" fill="var(--coral)"/></svg>

  <div class="kicker">PROCRASTITYPE</div>
  <div class="headline">Know your type.<br>Then know<br><span class="hl">what works.</span></div>

  <div class="badge-wrap" data-hero>
    <div class="badge">
      <div class="badge-ring"></div>
      <div class="n">7</div>
      <div class="t">types.<br>one is yours.</div>
    </div>
  </div>

  <div class="footer">
    <div class="cta-btn">TAKE THE QUIZ</div>
    <div class="sub">free &middot; 5 minutes &middot; procrastitype.jnorthwood.com</div>
  </div>

</div>
</body>
</html>
