<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>{{TITLE}} - Share Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: {{PALETTE_PRIMARY}};
    --deep:    {{PALETTE_DEEP}};
    --shade:   {{PALETTE_SHADE}};
    --bone:        #f1ece1;
    --bone-soft:   rgba(241, 236, 225, 0.78);
    --bone-faint:  rgba(241, 236, 225, 0.4);
    --bone-rule:   rgba(241, 236, 225, 0.55);
    --card-w:      {{CARD_W}}px;
    --card-h:      {{CARD_H}}px;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Space Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  .card {
    width: var(--card-w);
    height: var(--card-h);
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(120% 80% at 50% 20%, var(--shade) 0%, var(--primary) 55%, var(--deep) 100%);
  }

  /* Paper grain */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 3px 3px, 5px 5px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode: overlay;
    opacity: 0.45;
    pointer-events: none;
    z-index: 1;
  }

  /* Vignette */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(110% 70% at 50% 50%, transparent 55%, rgba(0,0,0,0.2) 100%);
    pointer-events: none;
    z-index: 2;
  }

  .frame {
    position: absolute;
    inset: 72px;
    display: flex;
    flex-direction: column;
    z-index: 3;
  }

  /* Top zone */
  .series {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .series-left {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 20px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--bone-soft);
    white-space: nowrap;
    font-weight: 400;
  }

  .series-right {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 20px;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    color: var(--bone-soft);
    white-space: nowrap;
    font-weight: 400;
  }

  .top-rule {
    margin-top: 34px;
    width: 100%;
    height: 1px;
    background: var(--bone-rule);
    flex-shrink: 0;
  }

  /* Center zone */
  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    padding: 0 12px;
  }

  .claim-small {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 26px;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    color: var(--bone-soft);
    margin-bottom: 40px;
  }

  .title {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 500;
    font-size: {{TITLE_SIZE}}px;
    line-height: 0.98;
    letter-spacing: 0.06em;
    text-indent: 0.06em;
    color: var(--bone);
    margin: 0;
    text-transform: uppercase;
  }

  .title span {
    display: block;
  }

  .subtitle {
    margin-top: 48px;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 300;
    font-size: 30px;
    line-height: 1.35;
    letter-spacing: 0.02em;
    color: var(--bone-soft);
    max-width: 820px;
    margin-left: auto;
    margin-right: auto;
    text-wrap: balance;
  }

  .subtitle-rule {
    width: 64px;
    height: 1px;
    background: var(--bone-rule);
    margin: 44px auto 0 auto;
  }

  /* Bottom zone */
  .bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    padding-bottom: 4px;
  }

  .link {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 24px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--bone);
  }

  .link.sub {
    font-size: 18px;
    letter-spacing: 0.14em;
    color: var(--bone-soft);
  }

  .cta {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 400;
    font-size: 22px;
    line-height: 1.4;
    letter-spacing: 0.02em;
    color: var(--bone-soft);
  }

  .bottom-rule {
    position: absolute;
    left: 72px;
    right: 72px;
    bottom: 180px;
    height: 1px;
    background: var(--bone-rule);
    z-index: 3;
  }

  /* Corner ticks */
  .tick {
    position: absolute;
    width: 18px;
    height: 18px;
    border: 2px solid var(--bone-faint);
    z-index: 3;
  }
  .tick.tl { top: 46px; left: 46px; border-right: 0; border-bottom: 0; }
  .tick.tr { top: 46px; right: 46px; border-left: 0; border-bottom: 0; }
  .tick.bl { bottom: 46px; left: 46px; border-right: 0; border-top: 0; }
  .tick.br { bottom: 46px; right: 46px; border-left: 0; border-top: 0; }
</style>
</head>
<body>

<div class="card" id="card">
  <span class="tick tl"></span>
  <span class="tick tr"></span>
  <span class="tick bl"></span>
  <span class="tick br"></span>

  <div class="frame">
    <header class="series">
      <span class="series-left">{{SERIES_NAME}}</span>
      <span class="series-right">{{EYEBROW}}</span>
    </header>
    <div class="top-rule"></div>

    <section class="center">
      <p class="claim-small">I'm {{ARTICLE}}</p>
      <h1 class="title">{{TITLE_HTML}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
      <div class="subtitle-rule"></div>
    </section>

    <span class="bottom-rule"></span>

    <footer class="bottom">
      <span class="link">{{QUIZ_URL}}</span>
      <span class="link">{{BOOK_URL}}</span>
      <span class="link sub">all books: {{SHOP_URL}}</span>
    </footer>
  </div>
</div>

</body>
</html>
